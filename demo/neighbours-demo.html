<title>Neighbours.com Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: dunkle Demo-Leiste (Rollenwechsel) über der App. Kund:innen sehen eine Marktplatz-Startseite,
   Anbieterin und Admin arbeiten in einem Dashboard mit Seitenleiste. Ein Theme, bewusst hell wie das Live-Produkt;
   alle Farben sind explizit gesetzt und im Admin änderbar. */
:root {
  color-scheme: light;
  --brand: #0d5c56;
  --accent: #ff6b4a;
  --bg: #f5f7f6;
  --ink: #10201e;
  --muted: #5d6f6c;
  --faint: #8a9a97;
  --line: #e1e7e5;
  --surface: #ffffff;
  --soft: #eef2f1;
  --night: #0b1d1b;
  --night-ink: #e7f0ee;
  --ok-bg: #e7f6ef; --ok-ink: #0b6b45;
  --warn-bg: #fff4e0; --warn-ink: #8a5300;
  --err-bg: #fdecec; --err-ink: #b42318;
  --radius: 14px;
  --font-head: "Playfair Display", Georgia, "Times New Roman", serif;
  --font-body: "DM Sans", ui-sans-serif, system-ui, sans-serif;
  --shadow: 0 1px 2px rgba(16,32,30,.05), 0 8px 24px -12px rgba(16,32,30,.12);
  --shadow-lift: 0 22px 44px -20px rgba(16,32,30,.38);
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--night); }
h1, h2, h3, .head { font-family: var(--font-head); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--brand); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Demo-Leiste */
.demobar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--night); color: var(--night-ink); font-size: 13px; }
.demobar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 8px; }
.demobar .tag { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.seg { display: inline-flex; flex-wrap: wrap; background: rgba(255,255,255,.08); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--night-ink); padding: 5px 14px; border-radius: 999px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--night-ink); color: var(--night); }
.demobar .reset { margin-left: auto; background: transparent; border: 1px solid rgba(255,255,255,.22); color: var(--night-ink); border-radius: 999px; padding: 4px 14px; }

/* App-Header */
.apphead { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 44px); z-index: 20; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.apphead .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding-block: 11px; }
.logo { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; text-align: left; }
.mark { width: 38px; height: 38px; border-radius: 12px; background: var(--brand); color: #fff; display: grid; place-items: center; font-family: var(--font-head); font-weight: 700; font-size: 20px; flex: none; }
.logo .name { display: block; font-family: var(--font-head); font-weight: 700; font-size: 21px; color: var(--ink); line-height: 1.1; }
.logo .tagline { display: block; font-size: 12px; color: var(--muted); }
nav.top { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }
nav.top button { border: 0; background: none; padding: 8px 12px; border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--muted); }
nav.top button:hover { background: var(--soft); color: var(--ink); }
nav.top button[aria-current="page"] { color: var(--ink); background: var(--soft); }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 11px; font-size: 13px; font-weight: 700; background: var(--accent); color: #fff; font-variant-numeric: tabular-nums; }

main { padding-block: 28px 56px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
.card.flush { padding: 0; overflow: hidden; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; background: var(--brand); color: #fff; padding: 10px 18px; border-radius: calc(var(--radius) * .8); font-weight: 600; font-size: 14px; transition: transform .15s, opacity .15s, background .15s; white-space: nowrap; }
.btn:hover { opacity: .92; }
.btn:active { transform: translateY(1px); }
.btn.accent { background: var(--accent); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.ghost:hover { background: var(--soft); opacity: 1; }
.btn.danger { background: #c4321f; }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn.block { width: 100%; }
.input { width: 100%; border: 1px solid #cfd8d6; background: var(--surface); padding: 10px 12px; border-radius: calc(var(--radius) * .6); }
.input:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
label.lbl { display: block; font-size: 13px; font-weight: 600; color: #34433f; margin-bottom: 5px; }
.badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.b-ok { background: var(--ok-bg); color: var(--ok-ink); }
.b-warn { background: var(--warn-bg); color: var(--warn-ink); }
.b-err { background: var(--err-bg); color: var(--err-ink); }
.b-mute { background: var(--soft); color: var(--muted); }
.b-brand { background: color-mix(in srgb, var(--brand) 11%, transparent); color: var(--brand); }
.note { border-radius: 10px; padding: 10px 14px; font-size: 14px; }
.note.ok { background: var(--ok-bg); color: var(--ok-ink); }
.note.err { background: var(--err-bg); color: var(--err-ink); }
.note.warn { background: var(--warn-bg); color: var(--warn-ink); }
.avatar { border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; overflow: hidden; font-family: var(--font-head); }
.avatar img { width: 100%; height: 100%; object-fit: cover; }

/* Startseite */
.hero { position: relative; overflow: hidden; background: var(--brand); color: #fff; border-radius: calc(var(--radius) * 2); padding: clamp(36px, 6vw, 76px) clamp(22px, 5vw, 64px); }
.hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; filter: blur(40px); }
.hero::before { width: 420px; height: 420px; right: -120px; top: -160px; background: rgba(255,255,255,.14); }
.hero::after { width: 360px; height: 360px; left: 38%; bottom: -220px; background: color-mix(in srgb, var(--accent) 55%, transparent); }
.hero > * { position: relative; }
.hero .kicker { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.14); border-radius: 999px; padding: 5px 14px; font-size: 13px; font-weight: 500; }
.hero h1 { font-size: clamp(36px, 6.4vw, 68px); line-height: 1.02; max-width: 16ch; margin-top: 18px; font-weight: 700; }
.hero h1 em { font-style: italic; color: color-mix(in srgb, var(--accent) 70%, #fff); }
.hero .lead { max-width: 58ch; opacity: .86; margin-top: 16px; font-size: 17px; }
.search { margin-top: 28px; background: var(--surface); color: var(--ink); border-radius: var(--radius); padding: 8px; display: grid; gap: 6px; grid-template-columns: 2fr 1.3fr 1.4fr 1fr auto; box-shadow: 0 30px 60px -30px rgba(0,0,0,.5); }
.search .input { border: 0; background: var(--soft); }
@media (max-width: 900px) { .search { grid-template-columns: 1fr 1fr; } .search .q { grid-column: 1 / -1; } }
@media (max-width: 480px) { .search { grid-template-columns: 1fr; } }
.search .more { grid-column: 1 / -1; }
.search .more summary { cursor: pointer; padding: 6px 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
.more-grid { display: grid; gap: 6px; padding: 4px 0 2px; grid-template-columns: repeat(5, minmax(0, 1fr)); }
@media (max-width: 900px) { .more-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 480px) { .more-grid { grid-template-columns: 1fr; } }
.svc { display: flex; gap: 18px; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); transition: box-shadow .2s, transform .2s; }
.svc:hover { box-shadow: var(--shadow-lift); transform: translateY(-2px); }
.svc .cover { width: 220px; flex: none; border-radius: calc(var(--radius) * .8); }
@media (max-width: 640px) { .svc { flex-direction: column; } .svc .cover { width: 100%; } }
.pgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.pgrid button { border: 0; padding: 0; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--soft); }
.pgrid img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s; }
.pgrid button:hover img { transform: scale(1.06); }
.plform { grid-template-columns: 1fr 2fr auto; align-items: end; }
@media (max-width: 700px) { .plform { grid-template-columns: 1fr; } }
.facts li { display: flex; align-items: center; gap: 10px; padding-block: 5px; font-size: 14px; }
.facts .ico { width: 32px; height: 32px; border-radius: 9px; }
.facts .ico svg.i { width: 16px; height: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.chips button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,.28); background: transparent; color: #fff; border-radius: 999px; padding: 6px 14px; font-size: 13px; }
.chips button:hover, .chips button[aria-pressed="true"] { background: #fff; color: var(--ink); border-color: #fff; }
.trust { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.trust .card { display: flex; gap: 14px; align-items: flex-start; padding: 18px; }
.ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--brand) 10%, transparent); color: var(--brand); flex: none; }
.ico.acc { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.ico svg.i { width: 22px; height: 22px; }

.grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.listing { display: flex; flex-direction: column; text-align: left; padding: 0; overflow: hidden; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); transition: transform .3s, box-shadow .3s; }
.listing:hover { transform: translateY(-4px); box-shadow: var(--shadow-lift); }
.cover { position: relative; aspect-ratio: 4 / 3; max-width: 100%; overflow: hidden; background: var(--soft); }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s; }
.listing:hover .cover img { transform: scale(1.06); }
.cover .shade { position: absolute; inset: 50% 0 0; background: linear-gradient(to top, rgba(0,0,0,.42), transparent); }
.cover .price { position: absolute; left: 12px; bottom: 12px; background: #fff; color: #10201e; border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; box-shadow: 0 4px 12px rgba(0,0,0,.18); }
.cover .tl { position: absolute; left: 12px; top: 12px; }
.cover .tr { position: absolute; right: 12px; top: 12px; display: inline-flex; align-items: center; gap: 4px; background: rgba(0,0,0,.55); color: #fff; border-radius: 999px; padding: 2px 9px; font-size: 12px; }
.cover .tr svg.i { width: 13px; height: 13px; }
.tag-video { background: var(--accent); color: #fff; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; }
.listing .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
.listing h3 { font-size: 18px; line-height: 1.25; font-weight: 600; }
.listing .foot { margin-top: auto; padding-top: 6px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.listing .foot .where { margin-left: auto; display: inline-flex; align-items: center; gap: 3px; }
.listing .foot svg.i { width: 14px; height: 14px; }
.verified { display: inline-flex; align-items: center; gap: 4px; color: var(--ok-ink); font-size: 12px; font-weight: 600; }
.verified svg.i { width: 14px; height: 14px; }

/* Dialog */
dialog { border: 0; padding: 0; border-radius: calc(var(--radius) * 1.4); width: min(980px, calc(100vw - 24px)); max-height: calc(100vh - 32px); background: var(--surface); color: var(--ink); box-shadow: 0 40px 80px -30px rgba(0,0,0,.5); }
dialog::backdrop { background: rgba(11,29,27,.55); backdrop-filter: blur(3px); }
.dlg { display: grid; grid-template-columns: 1.55fr 1fr; }
@media (max-width: 760px) { .dlg { grid-template-columns: 1fr; } }
.dlg > div { padding: 24px; min-width: 0; }
.dlg aside { background: var(--soft); display: flex; flex-direction: column; gap: 14px; }
.close { position: absolute; right: 12px; top: 12px; z-index: 2; border: 0; background: var(--surface); width: 36px; height: 36px; border-radius: 50%; font-size: 20px; box-shadow: var(--shadow); }
.gal { position: relative; border-radius: var(--radius); overflow: hidden; aspect-ratio: 4 / 3; background: var(--soft); }
.gal img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gal .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); font-size: 22px; box-shadow: var(--shadow); }
.gal .prev { left: 12px; } .gal .next { right: 12px; }
.gal .count { position: absolute; right: 12px; bottom: 12px; background: rgba(0,0,0,.6); color: #fff; border-radius: 999px; padding: 2px 10px; font-size: 12px; }
.thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.thumbs button { border: 0; padding: 0; width: 76px; height: 58px; border-radius: 10px; overflow: hidden; flex: none; opacity: .6; outline: 2px solid transparent; outline-offset: 0; }
.thumbs button[aria-current="true"] { opacity: 1; outline-color: var(--brand); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }

/* Dashboard */
.dash { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 28px; }
.dash > * { min-width: 0; }
@media (max-width: 960px) { .dash { grid-template-columns: minmax(0, 1fr); gap: 18px; } }
.side { position: sticky; top: 132px; align-self: start; display: flex; flex-direction: column; gap: 3px; }
@media (max-width: 960px) { .side { position: static; flex-direction: row; overflow-x: auto; padding-bottom: 4px; } .side .side-title, .side .side-card { display: none; } }
.side-title { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); padding: 0 12px 8px; }
.side button { display: flex; align-items: center; gap: 11px; border: 0; background: none; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 500; color: var(--muted); text-align: left; white-space: nowrap; flex: none; }
.side button:hover { background: var(--surface); color: var(--ink); }
.side button[aria-current="page"] { background: var(--brand); color: #fff; box-shadow: 0 8px 18px -10px var(--brand); }
.side button .cnt { margin-left: auto; background: var(--accent); color: #fff; border-radius: 999px; font-size: 11px; font-weight: 700; padding: 1px 8px; }
.side button[aria-current="page"] .cnt { background: rgba(255,255,255,.25); }
.side-card { margin-top: 14px; padding: 16px; border-radius: var(--radius); background: var(--night); color: var(--night-ink); font-size: 13px; }
.side-card strong { display: block; font-family: var(--font-head); font-size: 17px; margin-bottom: 4px; color: #fff; }
.content { min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.ph h1 { font-size: clamp(26px, 3.4vw, 34px); font-weight: 700; }
.ph p { color: var(--muted); margin-top: 4px; }
.stats { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.stat { display: flex; gap: 14px; align-items: flex-start; }
.stat .lab { font-size: 13px; color: var(--muted); }
.stat .val { font-family: var(--font-head); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat .hint { font-size: 12px; color: var(--muted); }
.stat .up { color: var(--ok-ink); font-weight: 600; }
.cols { display: grid; gap: 22px; grid-template-columns: 1.5fr 1fr; }
.cols.even { grid-template-columns: 1fr 1fr; }
@media (max-width: 900px) { .cols, .cols.even { grid-template-columns: 1fr; } }
.panel-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.panel-h h2 { font-size: 19px; font-weight: 600; }
.list > * + * { border-top: 1px solid var(--line); }
.list > * { padding-block: 13px; }
.thumb { width: 64px; height: 50px; border-radius: 10px; object-fit: cover; flex: none; background: var(--soft); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 14px; border-top: 1px solid var(--line); vertical-align: middle; }
tr:first-child td { border-top: 0; }
.stackimgs { display: flex; }
.stackimgs img { width: 30px; height: 30px; border-radius: 8px; object-fit: cover; border: 2px solid var(--surface); margin-left: -8px; }
.stackimgs img:first-child { margin-left: 0; }

/* Diagramm */
.chart { position: relative; padding-left: 40px; }
.chart .plot { position: relative; height: 190px; display: flex; gap: 8px; align-items: flex-end; }
.chart .gl { position: absolute; left: -40px; right: 0; display: flex; align-items: center; gap: 8px; transform: translateY(50%); pointer-events: none; }
.chart .gl span { width: 32px; text-align: right; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.chart .gl i { flex: 1; height: 1px; background: var(--line); }
.chart .bar { position: relative; flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
.chart .bar b { display: block; width: 100%; max-width: 30px; background: var(--brand); border-radius: 4px 4px 0 0; transition: opacity .15s; }
.chart .bar:last-child b { background: var(--accent); }
.chart .bar:hover b { opacity: .8; }
.chart .tip { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--night); color: #fff; font-size: 12px; padding: 4px 9px; border-radius: 8px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 2; }
.chart .bar:hover .tip, .chart .bar:focus .tip { opacity: 1; }
.chart .bar:nth-last-child(-n+2) .tip { left: auto; right: 0; transform: none; }
.chart .gl + .bar .tip, .chart .gl + .bar + .bar .tip { left: 0; transform: none; }
.chart .xl { display: flex; gap: 8px; margin-top: 6px; }
.chart .xl span { flex: 1; text-align: center; font-size: 11px; color: var(--faint); }
.meter { height: 8px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--brand); border-radius: 999px; }

/* Foto-Verwaltung */
.drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; border: 2px dashed #c4d0cd; border-radius: var(--radius); padding: 28px 18px; cursor: pointer; transition: background .15s, border-color .15s; }
.drop:hover, .drop.over { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 5%, transparent); }
.drop svg.i { width: 34px; height: 34px; color: var(--brand); }
.photos { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.photo { position: relative; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.photo img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
.photo .cov { position: absolute; left: 8px; top: 8px; background: var(--brand); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
.photo .del { position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 16px; line-height: 1; }

function chart(values, labels, unit) {
  const max = Math.max(1, ...values);
  const pow = 10 ** Math.floor(Math.log10(max));
  const nice = ([1, 2, 2.5, 5, 10].find((s) => s * pow >= max) || 10) * pow;
  return `<div class="chart" role="img" aria-label="Säulendiagramm: ${labels.map((l, i) => `${l} ${values[i]} ${unit}`).join(", ")}">
    <div class="plot">
      ${[0, nice / 2, nice].map((t) => `<div class="gl" style="bottom:${(t / nice) * 100}%"><span>${fmt(t)}</span><i></i></div>`).join("")}
      ${values.map((v, i) => `<div class="bar" tabindex="0"><b style="height:${(v / nice) * 100}%"></b><span class="tip">${labels[i]}: <strong>${fmt(v)}</strong> ${unit}</span></div>`).join("")}
    </div>
    <div class="xl">${labels.map((l, i) => `<span>${i % 2 === 0 || i === labels.length - 1 ? l : ""}</span>`).join("")}</div>

}

function filtered() {
  const { q, place, cat, type } = S.filters;
  return visible().filter((l) => {
    const p = P(l.p);
    if (q && !(l.title + " " + l.desc + " " + l.cat).toLowerCase().includes(q.toLowerCase())) return false;
    if (place) {
      if (/^\d+$/.test(place)) { if (!p.plz.startsWith(place)) return false; }
      else if (!p.city.toLowerCase().includes(place.toLowerCase())) return false;
    }
    if (cat && l.cat !== cat) return false;
    if (type && l.type !== type) return false;
    const f = S.filters, st = S.settings;
    if (st.filterPrice && f.maxPrice && l.price > +f.maxPrice) return false;
    if (st.filterExperience && f.minExp && p.exp < +f.minExp) return false;
    if (st.filterLanguage && f.lang && !p.langs.includes(f.lang)) return false;
    if (st.filterRating && f.minRating && p.rating < +f.minRating) return false;
    if (st.filterPhotos && f.photosOnly && l.photos.length === 0) return false;
    if (st.filterSocial && f.social && !p.social[f.social]) return false;
    return true;
  });
}

}

function placeOrder(id, note) {
  const l = L(id), msg = $("#order-msg");
  if (S.credits < l.price) {
    msg.innerHTML = `<div class="note err stack" style="gap:8px">Nicht genügend Credits. Du hast ${fmt(S.credits)}, brauchst ${fmt(l.price)}.<button class="btn accent sm" data-nav="credits" type="button">Credits aufladen</button></div>`;
    return;
  }
  S.credits -= l.price;
  S.orders.unshift({ id: Date.now(), listing: id, buyer: "Demo-Kundin", note, status: "OPEN", price: l.price, fee: l.price - share(l.price), mine: true, date: "Heute" });
  $("#dlg").close();
  S.flash = { kind: "ok", text: `Gebucht: „${l.title}“. ${fmt(l.price)} Credits sind reserviert, bis ${P(l.p).name} die Leistung erledigt hat.` };
  go("bookings");
}

function sendChat(pid, text, asProvider) {
  if (!text.trim()) { S.flash = { kind: "err", text: "Bitte schreibe eine Nachricht." }; return render(); }
  if (blocked(text)) { S.flash = { kind: "err", text: "Die Nachricht enthält unzulässige Inhalte und wurde nicht gesendet." }; return render(); }
  const p = P(pid);
  if (asProvider) { (S.chats[pid] ||= []).push({ me: false, text, t: now() }); return render(); }
  if (S.credits < p.chat) { S.flash = { kind: "err", text: "Nicht genügend Credits. Bitte lade dein Guthaben auf." }; return render(); }
  S.credits -= p.chat; S.earnings[pid] += share(p.chat); S.stats.revenue += p.chat - share(p.chat);
  (S.chats[pid] ||= []).push({ me: true, text, cost: p.chat, t: now() });
  S.typing = pid; render();
  setTimeout(() => {
    S.typing = null;
    const replies = ["Hallo! Danke für deine Nachricht. Wann würde es dir passen?", "Das klingt gut, das bekomme ich hin.", "Gern! Buch mich einfach über die Anzeige, dann ist alles abgesichert.", "Am Wochenende hätte ich Zeit. Samstagvormittag?"];
    S.chats[pid].push({ me: false, text: replies[S.chats[pid].length % replies.length], t: now() });
    if (S.view === "chat" || S.view === "p-chat") render();
  }, 1400);
}

          ${txt("footerText", "Footer-Text", true)}
        </fieldset>
        <fieldset class="fields" style="border:0;padding:0;margin:0"><legend class="head" style="font-weight:600;font-size:18px;margin-bottom:10px">Schriften</legend>${font("headingFont", "Überschriften")}${font("bodyFont", "Fließtext")}</fieldset>
        <fieldset class="fields" style="border:0;padding:0;margin:0"><legend class="head" style="font-weight:600;font-size:18px;margin-bottom:10px">Farben & Form</legend>
          <div class="full row">${presets.map(([n, b, a, bg]) => `<button type="button" class="btn ghost sm" data-preset="${b},${a},${bg}"><span style="display:inline-flex"><span style="width:14px;height:14px;border-radius:50%;background:${b}"></span><span style="width:14px;height:14px;border-radius:50%;background:${a};margin-left:-4px"></span></span>${n}</button>`).join("")}</div>
          ${col("brand", "Hauptfarbe")}${col("accent", "Akzentfarbe")}${col("bg", "Hintergrund")}${col("ink", "Textfarbe")}
          ${field("s-radius", `Eckenradius: <span class="num" id="radius-val">${s.radius}</span> px`, `<input type="range" id="s-radius" data-set="radius" min="0" max="28" value="${s.radius}" style="width:100%">`)}

      <div class="stack" style="position:sticky;top:132px;align-self:start"><span class="eyebrow">Live-Vorschau</span><div id="preview">${adminPreview()}</div></div>

};

/* ================= Fotos ================= */
// Verkleinert ein hochgeladenes Bild per Canvas. Das Neuzeichnen entfernt nebenbei alle Metadaten (z. B. GPS).
function readImage(file, max = 1400) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function addPhotos(files) {
  const l = L(S.editId); if (!l) return;
  const list = Array.from(files).filter((f) => f.type.startsWith("image/")).slice(0, 8 - l.photos.length);
  if (!list.length) { toast("Bitte wähle Bilddateien aus (JPG, PNG, WebP)."); return; }
  try {
    for (const f of list) l.photos.push(await readImage(f));
    S.flash = { kind: "ok", text: list.length === 1 ? "Foto hochgeladen." : `${list.length} Fotos hochgeladen.` };
  } catch { S.flash = { kind: "err", text: "Ein Foto konnte nicht gelesen werden." }; }
  render();
}

/* ================= Events ================= */
document.addEventListener("click", (e) => {
  if (e.target.id === "dlg") { e.target.close(); return; }
  if (e.target.closest("#drop")) { $("#file-photos").click(); return; }
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.role) { S.role = d.role; S.view = { customer: "home", provider: "p-home", admin: "a-home" }[d.role]; render(); window.scrollTo({ top: 0 }); return; }
  if (t.id === "reset") { S = initialState(); CATS = Object.keys(CAT_META); render(); toast("Demo zurückgesetzt"); return; }
  if (t.id === "logo") { go({ customer: "home", provider: "p-home", admin: "a-home" }[S.role]); return; }
  if (d.nav) { if ($("#dlg").open) $("#dlg").close(); go(d.nav); return; }
  if (d.open) { openListing(+d.open); return; }
  if ("close" in d) { $("#dlg").close(); return; }
  if (d.gal) { const l = L(+d.lid); S.gallery = (S.gallery + +d.gal + l.photos.length) % l.photos.length; openListing(l.id, true); return; }
  if (d.galto) { S.gallery = +d.galto; openListing(+d.lid, true); return; }
  if (d.cat) { S.filters = { ...S.filters, cat: S.filters.cat === d.cat ? "" : d.cat }; render(); return; }
  if (d.place) { S.filters = { ...S.filters, place: S.filters.place === d.place ? "" : d.place }; render(); return; }
  if ("clear" in d) { S.filters = { ...EMPTY_FILTERS }; render(); return; }
  if (d.profile) { if ($("#dlg").open) $("#dlg").close(); S.profileId = d.profile; go("profile"); return; }
  if (d.chatwith) { if ($("#dlg").open) $("#dlg").close(); S.chats[d.chatwith] ||= []; S.activeChat = d.chatwith; go("chat"); return; }
  if (d.report) { $("#dlg").close(); S.reports.push({ id: Date.now(), listing: +d.report, reason: "In der Demo gemeldet: bitte prüfen.", by: "Demo-Kundin", date: "Heute" }); toast("Danke! Die Meldung liegt jetzt im Admin-Bereich."); return; }
  if (d.conv) { S.activeChat = d.conv; render(); return; }
  if (d.buy) { const p = PACKS.find((x) => x.id === d.buy); S.credits += p.credits; S.stats.soldCredits += p.credits; S.flash = { kind: "ok", text: `${fmt(p.credits)} Credits für ${euro(p.euro)} gutgeschrieben (Demo, keine echte Zahlung).` }; render(); return; }
  if (d.cancel) { const o = S.orders.find((x) => x.id === +d.cancel); if (o && o.status === "OPEN") { o.status = "CANCELLED"; if (o.mine) S.credits += o.price; S.flash = { kind: "ok", text: `Storniert. ${fmt(o.price)} Credits gehen zurück an die Kundin.` }; } render(); return; }
  if (d.deliver) {
    const o = S.orders.find((x) => x.id === +d.deliver), l = L(o.listing);
    o.status = "DELIVERED"; S.earnings[l.p] += o.price - o.fee; S.stats.revenue += o.fee;
    S.flash = { kind: "ok", text: `Erledigt! ${fmt(o.price - o.fee)} Credits für ${P(l.p).name}, ${fmt(o.fee)} Credits Gebühr für die Plattform.` };
    render(); return;
  }
  if ("newlisting" in d) {
    const pid = S.providerAs, id = ++S.nextId;
    S.listings.unshift({ id, p: pid, cat: CATS[0], type: "SERVICE", title: "Meine neue Anzeige", price: 100, desc: "Beschreibe hier dein Angebot: Was machst du, wann hast du Zeit, was bringst du mit?", active: false, photos: [] });
    S.editId = id; S.flash = { kind: "ok", text: "Entwurf angelegt. Füge Fotos hinzu, passe die Texte an und aktiviere die Anzeige." };
    go("p-edit"); return;
  }
  if (d.edit) { S.editId = +d.edit; go("p-edit"); return; }
  if (d.toggle) { const l = L(+d.toggle); l.active = !l.active; toast(l.active ? "Anzeige ist jetzt sichtbar" : "Anzeige ist pausiert"); render(); return; }
  if (d.pdel) { L(S.editId).photos.splice(+d.pdel, 1); render(); return; }
  if (d.pmove) { const ph = L(S.editId).photos, i = +d.pmove, j = i + +d.dir; [ph[i], ph[j]] = [ph[j], ph[i]]; render(); return; }
  if (d.pcover) { const ph = L(S.editId).photos; ph.unshift(ph.splice(+d.pcover, 1)[0]); toast("Titelbild geändert"); render(); return; }
  if ("avatar" in d) { $("#file-avatar").click(); return; }
  if ("avatarDel" in d) { P(S.providerAs).avatar = null; render(); return; }
  if (d.preset) { const [b, a, bg] = d.preset.split(","); Object.assign(S.settings, { brand: b, accent: a, bg }); render(); return; }
  if ("resetdesign" in d) { S.settings = { ...DEFAULT_SETTINGS }; render(); toast("Design zurückgesetzt"); return; }
  if (d.verify || d.reject) {
    const id = +(d.verify || d.reject), v = S.verifications.find((x) => x.id === id);
    S.verifications = S.verifications.filter((x) => x.id !== id);
    S.flash = { kind: "ok", text: d.verify ? `${v.name} ist freigeschaltet. Ihre Anzeigen sind jetzt sichtbar.` : `Anfrage von ${v.name} abgelehnt.` };
    render(); return;
  }
  if (d.resolve) { const r = S.reports.find((x) => x.id === +d.resolve); if (d.deact && r) L(r.listing).active = false; S.reports = S.reports.filter((x) => x.id !== +d.resolve); S.flash = { kind: "ok", text: d.deact ? "Anzeige deaktiviert, Meldung erledigt." : "Meldung verworfen." }; render(); return; }
  if (d.paid) { const p = S.payoutQueue.find((x) => x.id === +d.paid); S.payoutQueue = S.payoutQueue.filter((x) => x.id !== +d.paid); S.flash = { kind: "ok", text: d.rej ? `Auszahlung an ${P(p.p).name} abgelehnt, Betrag zurückgebucht.` : `${euro(p.amount / 10)} an ${P(p.p).name} als überwiesen markiert.` }; render(); return; }
  if (d.pltoggle) { const x = S.platforms.find((y) => y.id === d.pltoggle); x.active = !x.active; render(); return; }
  if (d.pldel) { S.platforms = S.platforms.filter((y) => y.id !== d.pldel); Object.values(S.providers).forEach((p) => delete p.social[d.pldel]); if (S.filters.social === d.pldel) S.filters.social = ""; S.flash = { kind: "ok", text: "Plattform gelöscht." }; render(); return; }
  if (d.plmove) { const i = +d.plmove, j = i + +d.dir; [S.platforms[i], S.platforms[j]] = [S.platforms[j], S.platforms[i]]; render(); return; }
  if (d.ban) { toast(`${d.ban} würde jetzt gesperrt (in der Demo ohne Wirkung).`); return; }
});

document.addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "search-form") {
    S.filters = {
      q: $("#f-q").value.trim(), place: $("#f-place").value.trim(), cat: $("#f-cat").value, type: $("#f-type").value,
      maxPrice: $("#f-price")?.value || "", minExp: $("#f-exp")?.value || "", lang: $("#f-lang")?.value || "", minRating: $("#f-rating")?.value || "",
      photosOnly: !!$("#f-photos")?.checked, social: $("#f-social")?.value || "",
    };
    render(); return;
  }
  if (f.id === "order-form") { placeOrder(+f.dataset.id, $("#o-note").value.trim()); return; }
  if (f.id === "chat-form") { sendChat(f.dataset.pid, $("#chat-text").value, f.dataset.asprovider === "1"); return; }
  if (f.id === "payout-form") {
    const n = +$("#po-credits").value, pid = S.providerAs;
    if (n < 200) S.flash = { kind: "err", text: "Mindestens 200 Credits pro Auszahlung." };
    else if (n > S.earnings[pid]) S.flash = { kind: "err", text: `Dein Verdienst reicht nicht aus. Verfügbar: ${fmt(S.earnings[pid])} Credits.` };
    else { S.earnings[pid] -= n; (S.payouts[pid] ||= []).unshift({ date: "Heute", amount: n, status: "REQUESTED" }); S.payoutQueue.unshift({ id: Date.now(), p: pid, amount: n, iban: $("#po-iban").value, date: "Heute" }); S.flash = { kind: "ok", text: `Auszahlung über ${euro(n / 10)} beantragt. Sie erscheint jetzt auch im Admin-Bereich.` }; }
    render(); return;
  }
  if (f.id === "edit-form") {
    const l = L(S.editId), title = $("#e-title").value.trim(), desc = $("#e-desc").value.trim();
    if (blocked(title + " " + desc)) { S.flash = { kind: "err", text: "Deine Anzeige enthält unzulässige Begriffe. Erotische oder sexuelle Angebote sind verboten." }; return render(); }
    if (title.length < 5) { S.flash = { kind: "err", text: "Der Titel ist zu kurz (mindestens 5 Zeichen)." }; return render(); }
    Object.assign(l, { title, desc, cat: $("#e-cat").value, type: $("#e-type").value, price: Math.max(1, +$("#e-price").value || 1) });
    S.flash = { kind: "ok", text: l.active ? "Anzeige gespeichert." : "Gespeichert. Aktiviere die Anzeige unter „Meine Anzeigen“, damit sie sichtbar wird." };
    render(); return;
  }
  if (f.id === "profile-form") {
    const p = P(S.providerAs);
    p.name = $("#pr-name").value.trim() || p.name; p.bio = $("#pr-bio").value.trim(); p.chat = Math.min(50, Math.max(2, +$("#pr-chat").value || 2));
    p.exp = Math.min(60, Math.max(0, +$("#pr-exp").value || 0));
    p.langs = [...document.querySelectorAll("input[name=pr-lang]:checked")].map((el) => el.value);
    const social = {};
    for (const el of document.querySelectorAll("input[data-social]")) {
      const raw = el.value.trim(); if (!raw) continue;
      const res = checkSocialUrl(raw, S.platforms.find((x) => x.id === el.dataset.social));
      if (res.error) { S.flash = { kind: "err", text: res.error }; return render(); }
      social[el.dataset.social] = res.url;
    }
    S.platforms.filter((x) => !x.active).forEach((x) => { if (p.social[x.id]) social[x.id] = p.social[x.id]; });
    p.social = social;
    S.flash = { kind: "ok", text: "Profil gespeichert." }; render(); return;
  }
  if (f.id === "platform-form") {
    const name = $("#pl-name").value.trim(), domains = parseDomains($("#pl-domains").value);
    const bad = domains.find(isBlockedDomain);
    if (name.length < 2) S.flash = { kind: "err", text: "Bitte gib einen Namen mit mindestens 2 Zeichen an." };
    else if (!domains.length) S.flash = { kind: "err", text: "Bitte gib mindestens eine Domain an, z. B. pinterest.com." };
    else if (bad) S.flash = { kind: "err", text: `${bad} ist eine Erotik- oder Link-Sammel-Plattform und kann nicht angelegt werden.` };
    else if (S.platforms.some((x) => x.name.toLowerCase() === name.toLowerCase())) S.flash = { kind: "err", text: "Diese Plattform gibt es schon." };
    else { S.platforms.push({ id: "p" + Date.now(), name, domains: domains.join(", "), active: true }); S.flash = { kind: "ok", text: `${name} angelegt. Anbieterinnen können den Link jetzt im Profil eintragen.` }; }
    render(); return;
  }
  if (f.id === "admin-filter") { S.adminFilter = $("#af-q").value.trim(); render(); return; }
  if (f.id === "cat-form") {
    const n = $("#cat-name").value.trim();
    if (n.length < 2) S.flash = { kind: "err", text: "Bitte gib einen Namen mit mindestens 2 Zeichen an." };
    else if (CATS.includes(n)) S.flash = { kind: "err", text: "Diese Kategorie gibt es schon." };
    else { CATS.push(n); S.flash = { kind: "ok", text: `Kategorie „${n}“ angelegt.` }; }
    render(); return;
  }
});

document.addEventListener("input", (e) => {
  const k = e.target.dataset?.set; if (!k) return;
  let v = e.target.type === "checkbox" ? e.target.checked : e.target.value;
  if (k === "radius" || k === "fee") v = Math.max(0, Math.min(k === "fee" ? 50 : 28, +v || 0));
  if (["brand", "accent", "bg", "ink"].includes(k) && !/^#[0-9a-fA-F]{6}$/.test(v)) return;
  S.settings[k] = v;
  applyBrand();
  // Nur Vorschau und Partnerfeld aktualisieren, damit Farbwähler und Cursor erhalten bleiben
  document.querySelectorAll(`[data-set="${k}"]`).forEach((el) => { if (el !== e.target) el.value = v; });
  $("#preview").innerHTML = adminPreview();
  if (k === "radius") $("#radius-val").textContent = v;
  if (k === "fee") $("#fee-note").textContent = `Gilt für Buchungen, Grußvideos und Chat-Nachrichten. Bei ${v} % bleiben von 100 Credits ${100 - v} bei der Anbieterin.`;
});
document.addEventListener("change", async (e) => {
  if (e.target.id === "provider-as") { S.providerAs = e.target.value; if (S.view === "p-edit") S.view = "p-listings"; render(); }
  if (e.target.id === "file-photos") { await addPhotos(e.target.files); e.target.value = ""; }
  if (e.target.id === "file-avatar" && e.target.files[0]) {
    try { P(S.providerAs).avatar = await readImage(e.target.files[0], 400); toast("Profilfoto gespeichert"); } catch { toast("Das Foto konnte nicht gelesen werden."); }
    e.target.value = ""; render();
  }
});
document.addEventListener("keydown", (e) => { if (e.target.id === "drop" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); $("#file-photos").click(); } });
["dragover", "dragleave", "drop"].forEach((type) => document.addEventListener(type, (e) => {
  const zone = e.target.closest?.("#drop"); if (!zone) return;
  e.preventDefault();
  zone.classList.toggle("over", type === "dragover");
  if (type === "drop") addPhotos(e.dataTransfer.files);
}));

render();
</script>
