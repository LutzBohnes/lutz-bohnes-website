<style>

:root {

  --brand: #0f766e;
  --accent: #f59e0b;
  --bg: #f8fafc;
  --ink: #0f172a;
  --muted: #5b6b7f;
  --line: #e2e8f0;
  --surface: #ffffff;
  --soft: #f1f5f9;
  --demo-bar: #132a2e;
  --demo-ink: #e6f1ef;
  --ok-bg: #ecfdf5; --ok-ink: #047857;
  --err-bg: #fef2f2; --err-ink: #b91c1c;
  --warn-bg: #fffbeb; --warn-ink: #92400e;
  --radius: 12px;
  --font-head: "Poppins", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Inter", ui-sans-serif, system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--demo-bar); }
h1, h2, h3, .head { font-family: var(--font-head); text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Demo-Leiste */
.demobar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--demo-bar); color: var(--demo-ink); font-size: 13px; }
.demobar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 8px; }
.demobar .tag { letter-spacing: .08em; text-transform: uppercase; font-weight: 600; font-size: 11px; opacity: .75; }
.seg { display: inline-flex; background: rgba(255,255,255,.08); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--demo-ink); padding: 5px 12px; border-radius: 999px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--demo-ink); color: var(--demo-bar); }
.demobar .reset { margin-left: auto; background: transparent; border: 1px solid rgba(255,255,255,.25); color: var(--demo-ink); border-radius: 999px; padding: 4px 12px; }

/* App-Header */
.apphead { background: var(--surface); border-bottom: 1px solid var(--line); }
.apphead .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px; }
.logo { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; text-align: left; }
.logo .mark { width: 38px; height: 38px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-family: var(--font-head); font-weight: 700; font-size: 18px; flex: none; }
.logo .name { display: block; font-family: var(--font-head); font-weight: 700; font-size: 20px; color: var(--brand); line-height: 1.1; }
.logo .tagline { display: block; font-size: 12px; color: var(--muted); }
nav.main { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }
nav.main button { border: 0; background: none; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
nav.main button:hover { background: var(--soft); }
nav.main button[aria-current="page"] { color: var(--brand); font-weight: 600; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; background: var(--accent); color: #fff; font-variant-numeric: tabular-nums; }

main { padding-block: 28px 48px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: var(--brand); color: #fff; padding: 9px 16px; border-radius: var(--radius); font-weight: 500; transition: opacity .15s; }
.btn:hover { opacity: .9; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.accent { background: var(--accent); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: #dc2626; }
.btn.block { width: 100%; }
.input { width: 100%; border: 1px solid #cbd5e1; background: var(--surface); padding: 9px 12px; border-radius: calc(var(--radius) * .6); }
.input:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
label.lbl { display: block; font-size: 13px; font-weight: 500; color: #334155; margin-bottom: 4px; }
.badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 500; }
.b-brand { background: color-mix(in srgb, var(--brand) 12%, transparent); color: var(--brand); }
.b-accent { background: color-mix(in srgb, var(--accent) 18%, transparent); color: color-mix(in srgb, var(--accent) 70%, #000); }
.b-ok { background: var(--ok-bg); color: var(--ok-ink); }
.b-warn { background: var(--warn-bg); color: var(--warn-ink); }
.b-mute { background: var(--soft); color: var(--muted); }
.note { border-radius: 8px; padding: 9px 12px; font-size: 14px; }
.note.ok { background: var(--ok-bg); color: var(--ok-ink); }
.note.err { background: var(--err-bg); color: var(--err-ink); }
.note.warn { background: var(--warn-bg); color: var(--warn-ink); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }

/* Hero + Suche */
.hero { background: var(--brand); color: #fff; border-radius: var(--radius); padding: 36px clamp(20px, 4vw, 44px); }
.hero h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.15; max-width: 22ch; }
.hero p { max-width: 60ch; opacity: .88; margin: 10px 0 0; }
.search { margin-top: 22px; background: var(--surface); color: var(--ink); border-radius: var(--radius); padding: 10px; display: grid; gap: 8px; grid-template-columns: 2fr 1.3fr 1.4fr 1fr auto; }
@media (max-width: 860px) { .search { grid-template-columns: 1fr 1fr; } .search .q { grid-column: 1 / -1; } }
@media (max-width: 460px) { .search { grid-template-columns: 1fr; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.chips button { border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.chips button:hover { background: rgba(255,255,255,.12); }

.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.listing { display: flex; flex-direction: column; text-align: left; padding: 0; overflow: hidden; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); transition: box-shadow .15s, transform .15s; }
.listing:hover { box-shadow: 0 6px 22px rgba(15,23,42,.08); transform: translateY(-1px); }
.thumb { aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center; font-family: var(--font-head); font-size: 40px; font-weight: 700; color: var(--brand); background: color-mix(in srgb, var(--brand) 9%, var(--surface)); position: relative; }
.thumb .kind { position: absolute; top: 10px; left: 10px; font-family: var(--font-body); font-size: 11px; font-weight: 600; }
.listing .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.listing h3 { font-size: 16px; line-height: 1.3; }
.price { font-family: var(--font-head); font-weight: 700; color: var(--brand); font-size: 18px; margin-top: auto; }
.verified { color: var(--ok-ink); font-size: 12px; font-weight: 500; }

/* Dialog */
dialog { border: 0; padding: 0; border-radius: var(--radius); width: min(860px, calc(100vw - 32px)); max-height: calc(100vh - 48px); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(15,23,42,.45); }
.dlg { display: grid; grid-template-columns: 1.6fr 1fr; }
@media (max-width: 720px) { .dlg { grid-template-columns: 1fr; } }
.dlg > div { padding: 22px; min-width: 0; }
.dlg aside { background: var(--soft); display: flex; flex-direction: column; gap: 14px; }
.close { position: absolute; right: 10px; top: 10px; border: 0; background: var(--surface); width: 34px; height: 34px; border-radius: 50%; font-size: 18px; }

/* Chat */
.chat { display: grid; grid-template-columns: 260px 1fr; gap: 16px; }
@media (max-width: 760px) { .chat { grid-template-columns: 1fr; } }
.convlist button { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 12px; }
.convlist button[aria-current="true"] { border-color: var(--brand); box-shadow: inset 3px 0 0 var(--brand); }
.msgs { display: flex; flex-direction: column; gap: 10px; min-height: 280px; max-height: 420px; overflow-y: auto; padding: 4px; }
.msg { max-width: 80%; padding: 9px 14px; border-radius: 18px; background: var(--soft); align-self: flex-start; }
.msg.me { align-self: flex-end; background: var(--brand); color: #fff; }
.msg .meta { font-size: 11px; opacity: .7; margin-top: 2px; }
.typing { font-size: 13px; color: var(--muted); font-style: italic; }

/* Konto / Admin */
.stats { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.stat .v { font-family: var(--font-head); font-weight: 700; font-size: 26px; color: var(--brand); font-variant-numeric: tabular-nums; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.tabs button { border: 0; background: none; padding: 7px 12px; border-radius: 8px; font-size: 14px; }
.tabs button[aria-selected="true"] { background: var(--brand); color: #fff; }
.list > * + * { border-top: 1px solid var(--line); }
.list > * { padding-block: 12px; }
.two { display: grid; gap: 20px; grid-template-columns: 1fr 1fr; }
@media (max-width: 820px) { .two { grid-template-columns: 1fr; } }
.editor { display: grid; gap: 22px; grid-template-columns: 1.5fr 1fr; align-items: start; }
@media (max-width: 860px) { .editor { grid-template-columns: 1fr; } }
.fields { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.fields .full { grid-column: 1 / -1; }
@media (max-width: 460px) { .fields { grid-template-columns: 1fr; } }
.colorrow { display: flex; gap: 8px; }
.colorrow input[type=color] { width: 44px; height: 40px; padding: 2px; border: 1px solid #cbd5e1; border-radius: 8px; background: var(--surface); flex: none; }
.packs { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.pack { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.pack .big { font-family: var(--font-head); font-size: 40px; font-weight: 700; color: var(--brand); line-height: 1; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--muted); font-weight: 500; padding: 8px 6px; }
td { padding: 10px 6px; border-top: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 50; max-width: calc(100vw - 32px); }
footer.app { border-top: 1px solid var(--line); background: var(--surface); }
footer.app .wrap { padding-block: 20px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const loadedFonts = new Set(["Poppins", "Inter"]);
function ensureFont(f) {

function filtered() {
  const { q, place, cat, type } = S.filters;
  return LISTINGS.filter((l) => {
    const p = PROVIDERS[l.p];
    if (q && !(l.title + " " + l.desc).toLowerCase().includes(q.toLowerCase())) return false;
    if (place) {
      if (/^\d+$/.test(place)) { if (!p.plz.startsWith(place)) return false; }
      else if (!p.city.toLowerCase().includes(place.toLowerCase())) return false;
    }
    if (cat && l.cat !== cat) return false;
    if (type && l.type !== type) return false;
    return true;
  });
}

    }).join("") : `<p class="muted" style="margin:auto">Schreib die erste Nachricht.</p>`}

    <form id="chat-form" class="stack" data-pid="${pid}" data-asprovider="${asProvider ? 1 : 0}">
      <textarea class="input" id="chat-text" rows="2" placeholder="Deine Nachricht …"></textarea>
      <div class="row between"><span class="small muted">${asProvider ? "Kund:innen zahlen pro Nachricht, du verdienst mit." : `Guthaben: <span class="num">${fmt(S.credits)}</span> Credits`}</span><button class="btn" type="submit">Senden</button></div>
      ${flashHtml()}
    </form>
    <p class="small muted" style="margin:0">Zu deiner Sicherheit: Teile keine Bank- oder Ausweisdaten im Chat. Unzulässige Inhalte werden automatisch blockiert.</p>
  </div>`;
}
function viewChat() {
  const ids = Object.keys(S.chats);
  if (!ids.length) return `<p class="card muted">Noch keine Chats. Öffne eine Anzeige und tippe auf „Chatten“.</p>`;
  if (!S.chats[S.activeChat]) S.activeChat = ids[0];
  return `<div class="stack"><h1 style="font-size:26px">Nachrichten</h1>
    <div class="chat"><div class="convlist stack" style="gap:8px">${ids.map((id) => {
      const last = S.chats[id].at(-1);
      return `<button data-conv="${id}" aria-current="${id === S.activeChat}"><strong>${esc(PROVIDERS[id].name)}</strong><br><span class="small muted">${last ? esc(last.text.slice(0, 42)) : "Noch keine Nachrichten"}</span></button>`;
    }).join("")}</div>
    ${chatPanel(S.activeChat, false)}</div></div>`;
}
function sendChat(pid, text, asProvider) {
  if (!text.trim()) { S.flash = { kind: "err", text: "Bitte schreibe eine Nachricht." }; return render(); }
  const bad = blocked(text);
  if (bad) { S.flash = { kind: "err", text: "Die Nachricht enthält unzulässige Inhalte und wurde nicht gesendet." }; return render(); }
  const p = PROVIDERS[pid];
  if (asProvider) {
    (S.chats[pid] ||= []).push({ me: false, text, t: now() });
    return render();
  }
  if (S.credits < p.chat) { S.flash = { kind: "err", text: "Nicht genügend Credits. Bitte lade dein Guthaben auf." }; return render(); }
  S.credits -= p.chat;
  S.earnings[pid] += share(p.chat);
  S.stats.revenue += p.chat - share(p.chat);
  (S.chats[pid] ||= []).push({ me: true, text, cost: p.chat, t: now() });
  S.typing = pid; render();
  setTimeout(() => {
    S.typing = null;
    const replies = ["Hallo! Danke für deine Nachricht. Wann würde es dir passen?", "Das klingt gut, das bekomme ich hin.", "Gern! Buch mich einfach über die Anzeige, dann ist alles abgesichert.", "Am Wochenende hätte ich Zeit. Samstagvormittag?"];
    S.chats[pid].push({ me: false, text: replies[S.chats[pid].length % replies.length], t: now() });
    if (S.view === "chat" || S.view === "pchat") render();
  }, 1400);
}

      </fieldset>
      <fieldset class="fields" style="border:0;padding:0;margin:0"><legend class="head" style="font-weight:600;margin-bottom:8px">Schriften</legend>${font("headingFont", "Überschriften")}${font("bodyFont", "Fließtext")}</fieldset>
      <fieldset class="fields" style="border:0;padding:0;margin:0"><legend class="head" style="font-weight:600;margin-bottom:8px">Farben & Form</legend>
        <div class="full row">${presets.map(([n, b, a, bg]) => `<button class="btn ghost small" data-preset="${b},${a},${bg}"><span style="width:14px;height:14px;border-radius:50%;background:${b};display:inline-block"></span>${n}</button>`).join("")}</div>
        ${col("brand", "Hauptfarbe")}${col("accent", "Akzentfarbe")}${col("bg", "Hintergrund")}${col("ink", "Textfarbe")}
        ${field("s-radius", `Eckenradius: <span class="num" id="radius-val">${s.radius}</span> px`, `<input type="range" id="s-radius" data-set="radius" min="0" max="28" value="${s.radius}" style="width:100%">`)}
      </fieldset>
      <fieldset class="fields" style="border:0;padding:0;margin:0"><legend class="head" style="font-weight:600;margin-bottom:8px">Geschäftsmodell</legend>
        ${field("s-fee", "Plattformgebühr in %", `<input class="input" type="number" id="s-fee" data-set="fee" min="0" max="50" value="${s.fee}">`)}
        <p class="small muted full" style="margin:0" id="fee-note">Gilt für Buchungen, Grußvideos und Chat-Nachrichten. Bei ${s.fee} % bleiben von 100 Credits ${100 - s.fee} bei der Anbieterin.</p>
      </fieldset>
      <div class="row"><button class="btn" data-nav="search">Seite ansehen</button><button class="btn ghost" data-resetdesign>Auf Standard zurücksetzen</button></div>
    </div>
    <div class="stack" style="position:sticky;top:64px"><span class="small muted">Vorschau</span><div id="preview">${adminPreview()}</div></div>
  </div>`;
}
function adminPreview() {
  const s = S.settings;
  return `<div style="border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--bg)">
    <div class="row" style="background:var(--surface);padding:10px 14px"><span class="logo"><span class="mark" style="width:30px;height:30px;font-size:14px">${esc((s.siteName.trim()[0] || "N").toUpperCase())}</span><span><span class="name" style="font-size:16px">${esc(s.siteName)}</span><span class="tagline">${esc(s.tagline)}</span></span></span></div>
    <div style="margin:12px;padding:16px;background:var(--brand);color:#fff;border-radius:var(--radius)"><div class="head" style="font-weight:700;font-size:18px">${esc(s.heroTitle)}</div><span class="btn accent" style="margin-top:10px;padding:5px 12px;font-size:13px">Suchen</span></div>
    <div style="margin:12px;display:grid">${card(LISTINGS[6])}</div>
  </div>`;
}
function adminVerify() {
  return `<p class="small muted" style="margin-top:0">Prüfe Alter (mind. 18) und Identität jeder Anbieterin, zum Beispiel per Videocall mit Ausweis, bevor ihre Anzeigen sichtbar werden.</p>
  ${S.verifications.length ? `<div class="list">${S.verifications.map((v) => `<div class="row between"><span><strong>${esc(v.name)}</strong> · ${esc(v.city)}<br><span class="small muted">Hinweis: ${esc(v.note)}</span></span><span class="row"><button class="btn" data-verify="${v.id}">Freischalten</button><button class="btn danger" data-reject="${v.id}">Ablehnen</button></span></div>`).join("")}</div>` : `<p class="muted" style="margin:0">Keine offenen Anfragen.</p>`}`;
}
function adminReports() {
  return S.reports.length ? `<div class="list">${S.reports.map((r) => { const l = listingById(r.listing); return `<div class="stack" style="gap:8px"><span><strong>${esc(l.title)}</strong> <span class="small muted">von ${esc(PROVIDERS[l.p].name)}</span></span><p class="note err" style="margin:0">${esc(r.reason)}</p><div class="row"><button class="btn danger" data-resolve="${r.id}">Anzeige deaktivieren</button><button class="btn ghost" data-resolve="${r.id}">Verwerfen</button></div></div>`; }).join("")}</div>` : `<p class="muted" style="margin:0">Keine offenen Meldungen.</p>`;
}
function adminCats() {
  return `<form id="cat-form" class="row" style="margin-bottom:12px"><input class="input" id="cat-name" placeholder="Neue Kategorie, z. B. Umzugshilfe" style="max-width:320px"><button class="btn" type="submit">Hinzufügen</button></form>
  <div class="list">${CATS.map((c) => `<div class="row between"><span>${esc(c)}</span><span class="small muted num">${LISTINGS.filter((l) => l.cat === c).length} Anzeigen</span></div>`).join("")}</div>`;
}
function adminUsers() {
  return `<div class="tablewrap"><table><thead><tr><th>Name</th><th>Rolle</th><th>Ort</th><th>Verdienst</th><th>Status</th></tr></thead><tbody>
  ${Object.entries(PROVIDERS).map(([id, p]) => `<tr><td>${esc(p.name)}</td><td>Anbieterin</td><td>${esc(p.city)}</td><td class="num">${fmt(S.earnings[id])}</td><td><span class="badge b-ok">verifiziert</span></td></tr>`).join("")}
  <tr><td>Demo-Kundin</td><td>Kund:in</td><td>Köln</td><td class="num">–</td><td><span class="badge b-mute">aktiv</span></td></tr>
  </tbody></table></div>`;
}

/* ---------- Events ---------- */
document.addEventListener("click", (e) => {
  if (e.target.id === "dlg") { e.target.close(); return; }
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.role) { S.role = d.role; S.view = { customer: "search", provider: "pdash", admin: "admin" }[d.role]; render(); return; }
  if (t.id === "reset") { S = initialState(); render(); toast("Demo zurückgesetzt"); return; }
  if (t.id === "logo") { go(S.role === "provider" ? "pdash" : "search"); return; }
  if (d.nav) { if ($("#dlg").open) $("#dlg").close(); go(d.nav); return; }
  if (d.open) { openListing(+d.open); return; }
  if ("close" in d) { $("#dlg").close(); return; }
  if (d.quick) {
    if (d.quick === "clear") S.filters = { q: "", place: "", cat: "", type: "" };
    else { const [k, v] = d.quick.split(":"); S.filters = { q: "", place: "", cat: "", type: "", [k]: v }; }
    render(); return;
  }
  if (d.chatwith) { $("#dlg").close(); S.chats[d.chatwith] ||= []; S.activeChat = d.chatwith; go("chat"); return; }
  if (d.report) { $("#dlg").close(); S.reports.push({ id: Date.now(), listing: +d.report, reason: "In der Demo gemeldet: bitte prüfen." }); toast("Danke! Die Meldung liegt jetzt im Admin-Bereich."); return; }
  if (d.conv) { S.activeChat = d.conv; render(); return; }
  if (d.buy) {
    const p = PACKS.find((x) => x.id === d.buy);
    S.credits += p.credits; S.stats.soldCredits += p.credits;
    S.flash = { kind: "ok", text: `${fmt(p.credits)} Credits für ${euro(p.euro)} gutgeschrieben (Demo, keine echte Zahlung).` };
    render(); return;
  }
  if (d.cancel) {
    const o = S.orders.find((x) => x.id === +d.cancel);
    if (o && o.status === "OPEN") { o.status = "CANCELLED"; if (o.mine) S.credits += o.price; S.flash = { kind: "ok", text: `Storniert. ${fmt(o.price)} Credits gehen zurück an die Kundin.` }; }
    render(); return;
  }
  if (d.deliver) {
    const o = S.orders.find((x) => x.id === +d.deliver), l = listingById(o.listing);
    o.status = "DELIVERED"; S.earnings[l.p] += o.price - o.fee; S.stats.revenue += o.fee;
    S.flash = { kind: "ok", text: `Erledigt! ${fmt(o.price - o.fee)} Credits für ${PROVIDERS[l.p].name}, ${fmt(o.fee)} Credits Gebühr für die Plattform.` };
    render(); return;
  }
  if ("newlisting" in d) { toast("In der echten App öffnet sich hier das Anzeigen-Formular."); return; }
  if (d.atab) { S.adminTab = d.atab; render(); return; }
  if (d.preset) { const [b, a, bg] = d.preset.split(","); Object.assign(S.settings, { brand: b, accent: a, bg }); render(); return; }
  if ("resetdesign" in d) { S.settings = { ...DEFAULT_SETTINGS }; render(); toast("Design zurückgesetzt"); return; }
  if (d.verify || d.reject) {
    const id = +(d.verify || d.reject), v = S.verifications.find((x) => x.id === id);
    S.verifications = S.verifications.filter((x) => x.id !== id);
    S.flash = { kind: "ok", text: d.verify ? `${v.name} ist freigeschaltet. Ihre Anzeigen sind jetzt sichtbar.` : `Anfrage von ${v.name} abgelehnt.` };
    render(); return;
  }
  if (d.resolve) { S.reports = S.reports.filter((x) => x.id !== +d.resolve); S.flash = { kind: "ok", text: "Meldung bearbeitet." }; render(); return; }
});

document.addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "search-form") {
    S.filters = { q: $("#f-q").value.trim(), place: $("#f-place").value.trim(), cat: $("#f-cat").value, type: $("#f-type").value };
    render(); return;
  }
  if (f.id === "order-form") { placeOrder(+f.dataset.id, $("#o-note").value.trim()); return; }
  if (f.id === "chat-form") { sendChat(f.dataset.pid, $("#chat-text").value, f.dataset.asprovider === "1"); return; }
  if (f.id === "payout-form") {
    const n = +$("#po-credits").value, pid = S.providerAs;
    if (n < 200) { S.flash = { kind: "err", text: "Mindestens 200 Credits pro Auszahlung." }; }
    else if (n > S.earnings[pid]) { S.flash = { kind: "err", text: `Dein Verdienst reicht nicht aus. Verfügbar: ${fmt(S.earnings[pid])} Credits.` }; }
    else { S.earnings[pid] -= n; S.flash = { kind: "ok", text: `Auszahlung über ${euro(n / 10)} beantragt. Überweisung in der Regel innerhalb von 5 Werktagen.` }; }
    render(); return;
  }
  if (f.id === "cat-form") {
    const n = $("#cat-name").value.trim();
    if (n.length < 2) { S.flash = { kind: "err", text: "Bitte gib einen Namen mit mindestens 2 Zeichen an." }; }
    else if (CATS.includes(n)) { S.flash = { kind: "err", text: "Diese Kategorie gibt es schon." }; }
    else { CATS.push(n); S.flash = { kind: "ok", text: `Kategorie „${n}“ angelegt.` }; }
    render(); return;
  }
});

document.addEventListener("input", (e) => {
  const k = e.target.dataset?.set; if (!k) return;
  let v = e.target.value;
  if (k === "radius" || k === "fee") v = Math.max(0, Math.min(k === "fee" ? 50 : 28, +v || 0));
  if (["brand", "accent", "bg", "ink"].includes(k) && !/^#[0-9a-fA-F]{6}$/.test(v)) return;
  S.settings[k] = v;
  applyBrand();
  // Nur Vorschau und Partnerfeld aktualisieren, damit Farbwähler und Cursor erhalten bleiben
  document.querySelectorAll(`[data-set="${k}"]`).forEach((el) => { if (el !== e.target) el.value = v; });
  $("#preview").innerHTML = adminPreview();
  if (k === "radius") $("#radius-val").textContent = v;
  if (k === "fee") $("#fee-note").textContent = `Gilt für Buchungen, Grußvideos und Chat-Nachrichten. Bei ${v} % bleiben von 100 Credits ${100 - v} bei der Anbieterin.`;
});
document.addEventListener("change", (e) => {
  if (e.target.id === "provider-as") { S.providerAs = e.target.value; render(); }
});

render();
</script>
